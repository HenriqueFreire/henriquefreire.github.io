# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: pt-BR

# Change to your timezone
timezone: America/Sao_Paulo

# jekyll-seo-tag settings
# ↓ --------------------------

title: Henrique Freire # o título principal

tagline: Téc. Radiologia | Notas técnicas, estágios e projetos # subtítulo

description: >- # usado pelo SEO meta e pelo feed atom
  Portfólio e blog de estudos de Henrique Freire, técnico em radiologia em
  formação. Anotações técnicas, relatos de estágio e projetos práticos.

# Preencha com o protocolo e o hostname do seu site.
# Ex.: 'https://henriquefreire.github.io', sem barra '/' no final.
url: "https://henriquefreire.github.io"

github:
  username: henriquefreire # troque se seu usuário real for diferente

twitter:
  username: # deixe vazio se não usar

social:
  # Nome completo, aparece como autor padrão dos posts e copyright no rodapé.
  name: Henrique Freire
  email: SEU_EMAIL_AQUI@dominio.com # TODO: trocar pelo seu e-mail real
  fediverse_handle:
  links:
    # O primeiro link é o que aparece como link do copyright no rodapé.
    - https://github.com/henriquefreire
    # TODO: decidir e preencher — perfil de dev já existente ou um dedicado
    # à área de radiologia, pra não misturar os algoritmos/audiências.
    - https://www.linkedin.com/in/LINKEDIN_A_DEFINIR
    # - https://www.facebook.com/username

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# Fim das configurações do `jekyll-seo-tag`

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode: # [light | dark] — vazio segue o tema do sistema

cdn: "https://chirpy-img.netlify.app"

# avatar na barra lateral — troque pela sua foto depois
avatar: "/commons/avatar.jpg"

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  # Giscus usa Issues/Discussions do próprio GitHub como backend dos comentários.
  # Depois de criar o repositório real, siga https://giscus.app pra gerar
  # os valores abaixo (repo_id, category, category_id) — eles são gerados
  # automaticamente pelo site do giscus a partir do seu repositório.
  provider: giscus
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo: henriquefreire/henriquefreire.github.io # TODO: confirmar nome exato do repo
    repo_id: # TODO: preencher via https://giscus.app
    category: General # categoria de Discussions a criar no repositório
    category_id: # TODO: preencher via https://giscus.app
    mapping: pathname
    strict:
    input_position: bottom
    lang: pt-BR
    reactions_enabled: 1

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ As opções abaixo não são recomendadas para alteração ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
